name: BitChord v1.9 desktop compatibility test
on:
  push:
    branches: [bitchord-v19-desktop-poc]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compile:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout official BitChord v1.9
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: v1.9
          persist-credentials: false
      - name: Restore desktop module from verified Google-login version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin 41198be97245cc3e7e3c0540da55435f3f02a9ea
          git checkout FETCH_HEAD -- desktopApp
          python3 - <<'PY'
          from pathlib import Path
          p=Path("settings.gradle.kts")
          s=p.read_text()
          assert 'include(":desktopApp")' not in s
          s=s.replace('include(":sharedUi")','include(":sharedUi")\ninclude(":desktopApp")',1)
          p.write_text(s)
          PY
          echo "Desktop module restored; compiling against v1.9 shared dependencies."
      - name: Adapt desktop interfaces for v1.9
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          root = Path("desktopApp/src/main/kotlin/com/music/bitchord/desktop")

          def apply(file, changes):
              p = root / file
              s = p.read_text()
              for before, after in changes:
                  if s.count(before) != 1:
                      raise RuntimeError(f"{file}: expected one occurrence of {before[:80]!r}, found {s.count(before)}")
                  s = s.replace(before, after, 1)
              p.write_text(s)
              print(f"patched {file}")

          apply("DesktopApp.kt", [
              (
                  "                                when (entity.entityType) {",
                  "                                when (entity.entityType) {\n                                    EntityType.OTHER -> Unit // v1.9 can store podcast pages; desktop navigation pending",
              ),
          ])

          apply("DesktopSharedPages.kt", [
              ("override val homeRecentsViewType:", "val homeRecentsViewType:"),
              ("override fun setHomeRecentsViewType(", "fun setHomeRecentsViewType("),
          ])

          apply("DesktopPlayerHost.kt", [
              (
                  "import com.music.bitchord.data.settings.MixBlend",
                  "import com.music.bitchord.data.settings.MixBlend\nimport com.music.bitchord.data.settings.MixTransitionView",
              ),
              (
                  "    override val hideSongStatus = MutableStateFlow(false)",
                  "    override val hideSongStatus = MutableStateFlow(false)\n    override val showQueueHistory = MutableStateFlow(false)\n    override val hideStatusBar = MutableStateFlow(false)\n    override val showListenTogetherButton = MutableStateFlow(true)",
              ),
              (
                  "    override val meteredConnection = MutableStateFlow<Boolean?>(false)",
                  "    override val meteredConnection = MutableStateFlow<Boolean?>(false)\n    override val streamCeilingOverride = MutableStateFlow<AudioQuality?>(null)",
              ),
              (
                  "    override val smartAnalysis = MutableStateFlow(SmartAnalysis())",
                  "    override val smartAnalysis = MutableStateFlow(SmartAnalysis())\n    override val automixDetail = MutableStateFlow<String?>(null)\n    override val smartMixView = MutableStateFlow<MixTransitionView?>(null)\n    override val smartMixProgress = MutableStateFlow(0f)",
              ),
              (
                  '        carriesHiRes = outputIsFloat == true || (outputBytesPerSample ?: 2) > 2 ||\n            (outputSampleRateHz ?: 0) > 48_000,',
                  '        bitPerfect = false, // This engine cannot verify exclusive bit-perfect output\n        dacLimited = false,',
              ),
          ])
          PY
      - name: Configure Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Compile desktop against v1.9
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :desktopApp:compileKotlin --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/v19-compile.log"
      - name: Package macOS installer if compatible
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :desktopApp:packageDmg -Pbitchord.version=1.9-desktop-poc --no-daemon --stacktrace 2>&1 | tee "$RUNNER_TEMP/v19-package.log"
      - name: Upload experimental installer
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-v19-desktop-PROOF-OF-CONCEPT-no-media-controls
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 5
          if-no-files-found: error
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-v19-compatibility-logs
          path: ${{ runner.temp }}/v19-*.log
          retention-days: 5
          if-no-files-found: ignore
