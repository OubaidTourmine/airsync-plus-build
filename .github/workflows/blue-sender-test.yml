name: Custom 32 pt banner preview
on:
  push:
    branches: [fix/notification-icon-layout]
    paths: [.github/workflows/blue-sender-test.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the blue sender test
        shell: bash
        run: |
          set -euo pipefail
          app="AirSync Banner Preview.app"
          mkdir -p "$app/Contents/"{MacOS,Resources}
          cp assets/BlueAirSync.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.oubaidtourmine.airsync.banner-preview</string>
          <key>CFBundleName</key><string>AirSync Banner Preview</string>
          <key>CFBundleExecutable</key><string>BlueSender</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict></plist>
          PLIST
          cat > Probe.swift <<'SWIFT'
          import AppKit

          final class Preview: NSObject, NSApplicationDelegate {
              private var panel: NSPanel?

              func applicationDidFinishLaunching(_ notification: Notification) {
                  guard let screen = NSScreen.main else { NSApp.terminate(nil); return }
                  let frame = screen.visibleFrame
                  let width: CGFloat = 350
                  let height: CGFloat = 76
                  let panel = NSPanel(
                      contentRect: NSRect(x: frame.maxX - width - 16, y: frame.maxY - height - 12,
                                          width: width, height: height),
                      styleMask: [.borderless, .nonactivatingPanel],
                      backing: .buffered, defer: false
                  )
                  panel.isOpaque = false
                  panel.backgroundColor = .clear
                  panel.hasShadow = true
                  panel.level = .floating
                  panel.collectionBehavior = [.moveToActiveSpace, .fullScreenAuxiliary]

                  let glass = NSVisualEffectView(frame: NSRect(x: 0, y: 0, width: width, height: height))
                  glass.material = .hudWindow
                  glass.blendingMode = .behindWindow
                  glass.state = .active
                  glass.wantsLayer = true
                  glass.layer?.cornerRadius = 20
                  glass.layer?.masksToBounds = true
                  glass.layer?.borderColor = NSColor.white.withAlphaComponent(0.15).cgColor
                  glass.layer?.borderWidth = 1

                  let iconY = (height - 32) / 2
                  let phone = NSImageView(frame: NSRect(x: 16, y: iconY, width: 32, height: 32))
                  if let url = Bundle.main.url(forResource: "AppIcon", withExtension: "icns") {
                      phone.image = NSImage(contentsOf: url)
                  }
                  phone.imageScaling = .scaleProportionallyUpOrDown
                  glass.addSubview(phone)

                  let tile = NSView(frame: NSRect(x: width - 48, y: iconY, width: 32, height: 32))
                  tile.wantsLayer = true
                  tile.layer?.cornerRadius = 8
                  tile.layer?.backgroundColor = NSColor(srgbRed: 0.36, green: 0.20, blue: 0.92, alpha: 1).cgColor
                  let glyph = NSImageView(frame: NSRect(x: 7, y: 7, width: 18, height: 18))
                  glyph.image = NSImage(systemSymbolName: "bell.fill", accessibilityDescription: "Test app icon")
                  glyph.contentTintColor = .white
                  tile.addSubview(glyph)
                  glass.addSubview(tile)

                  let title = NSTextField(labelWithString: "Notification Test")
                  title.font = .systemFont(ofSize: 14, weight: .semibold)
                  title.textColor = .white
                  title.frame = NSRect(x: 60, y: 39, width: 232, height: 18)
                  glass.addSubview(title)
                  let body = NSTextField(labelWithString: "Both icons are centered at 32 pt.")
                  body.font = .systemFont(ofSize: 13)
                  body.textColor = NSColor.white.withAlphaComponent(0.85)
                  body.frame = NSRect(x: 60, y: 20, width: 232, height: 18)
                  glass.addSubview(body)

                  panel.contentView = glass
                  self.panel = panel
                  panel.orderFrontRegardless()
                  DispatchQueue.main.asyncAfter(deadline: .now() + 14) { NSApp.terminate(nil) }
              }
          }

          let app = NSApplication.shared
          let preview = Preview()
          app.delegate = preview
          app.setActivationPolicy(.accessory)
          withExtendedLifetime(preview) { app.run() }
          SWIFT
          xcrun swiftc -target arm64-apple-macos14.5 Probe.swift -o "$app/Contents/MacOS/BlueSender"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" AirSync-Banner-Preview.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AirSync-Banner-Preview
          path: AirSync-Banner-Preview.zip
          if-no-files-found: error
