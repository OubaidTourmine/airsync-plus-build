name: Native 32 pt alignment test
on:
  push:
    branches: [fix/notification-icon-layout]
    paths: [.github/workflows/blue-sender-test.yml]
permissions:
  contents: read
jobs:
  build:
    runs-on: xcode-27
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build the blue sender test
        shell: bash
        run: |
          set -euo pipefail
          app="AirSync Alignment Test.app"
          mkdir -p "$app/Contents/"{MacOS,Resources}
          cp assets/BlueAirSync.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>com.oubaidtourmine.airsync.alignment-test</string>
          <key>CFBundleName</key><string>AirSync Alignment Test</string>
          <key>CFBundleExecutable</key><string>BlueSender</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleIconFile</key><string>AppIcon</string>
          <key>CFBundleVersion</key><string>1</string>
          <key>CFBundleShortVersionString</key><string>1.0</string>
          </dict></plist>
          PLIST
          cat > Probe.swift <<'SWIFT'
          import AppKit
          import UserNotifications
          import ImageIO

          final class Probe: NSObject, NSApplicationDelegate, UNUserNotificationCenterDelegate {
              func applicationDidFinishLaunching(_ notification: Notification) {
                  let center = UNUserNotificationCenter.current()
                  center.delegate = self
                  center.requestAuthorization(options: [.alert]) { allowed, error in
                      guard allowed else {
                          DispatchQueue.main.async {
                              self.finish(error?.localizedDescription ?? "Enable notifications for AirSync Alignment Test in System Settings, then open it again.")
                          }
                          return
                      }
                      DispatchQueue.main.async {
                          do {
                              try self.post(center: center, hideDate: false)
                              try self.post(center: center, hideDate: true)
                          } catch {
                              self.finish(error.localizedDescription)
                          }
                      }
                  }
              }

              func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification,
                                          withCompletionHandler completion: @escaping (UNNotificationPresentationOptions) -> Void) {
                  completion([.banner, .list])
              }

              private func post(center: UNUserNotificationCenter, hideDate: Bool) throws {
                  let content = UNMutableNotificationContent()
                  content.title = hideDate ? "B — Date flags on" : "A — Date flags off"
                  content.body = "Compare the two icon centers."
                  if hideDate {
                      for name in ["shouldHideDate", "shouldHideTime"] {
                          let setter = name == "shouldHideDate" ? "setShouldHideDate:" : "setShouldHideTime:"
                          guard content.responds(to: NSSelectorFromString(setter)) else {
                              throw NSError(domain: "AirSync Alignment Test", code: 1,
                                            userInfo: [NSLocalizedDescriptionKey: "This macOS version is missing " + setter])
                          }
                          content.setValue(true, forKey: name)
                      }
                  }

                  let url = FileManager.default.temporaryDirectory
                      .appendingPathComponent(UUID().uuidString + ".png")
                  let size = 256
                  guard let bitmap = CGContext(data: nil, width: size, height: size,
                                               bitsPerComponent: 8, bytesPerRow: 0,
                                               space: CGColorSpaceCreateDeviceRGB(),
                                               bitmapInfo: CGImageAlphaInfo.premultipliedLast.rawValue),
                        let output = CGImageDestinationCreateWithURL(url as CFURL, "public.png" as CFString, 1, nil)
                  else { throw CocoaError(.fileWriteUnknown) }
                  bitmap.setFillColor(red: 0.38, green: 0.22, blue: 0.91, alpha: 1)
                  bitmap.addPath(CGPath(roundedRect: CGRect(x: 0, y: 0, width: 256, height: 256),
                                        cornerWidth: 56, cornerHeight: 56, transform: nil))
                  bitmap.fillPath()
                  bitmap.setFillColor(red: 1, green: 1, blue: 1, alpha: 1)
                  bitmap.fillEllipse(in: CGRect(x: 86, y: 86, width: 84, height: 84))
                  guard let image = bitmap.makeImage() else { throw CocoaError(.fileWriteUnknown) }
                  CGImageDestinationAddImage(output, image, nil)
                  guard CGImageDestinationFinalize(output) else { throw CocoaError(.fileWriteUnknown) }
                  content.attachments = [try UNNotificationAttachment(identifier: "full-size", url: url)]
                  let trigger = UNTimeIntervalNotificationTrigger(timeInterval: hideDate ? 8 : 1, repeats: false)
                  let request = UNNotificationRequest(identifier: hideDate ? "align-b" : "align-a", content: content, trigger: trigger)
                  center.add(request) { error in
                      DispatchQueue.main.async {
                          if let error { self.finish(error.localizedDescription) }
                          else if hideDate {
                              DispatchQueue.main.asyncAfter(deadline: .now() + 12) { NSApp.terminate(nil) }
                          }
                      }
                  }
              }

              private func finish(_ message: String) {
                  let alert = NSAlert()
                  alert.messageText = message
                  alert.runModal()
                  NSApp.terminate(nil)
              }
          }

          let app = NSApplication.shared
          let probe = Probe()
          app.delegate = probe
          app.setActivationPolicy(.accessory)
          app.run()
          SWIFT
          xcrun swiftc -target arm64-apple-macos14.5 Probe.swift -o "$app/Contents/MacOS/BlueSender"
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --sign - "$app"
          codesign --verify --strict "$app"
          ditto -c -k --keepParent "$app" AirSync-Alignment-Test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AirSync-Alignment-Test
          path: AirSync-Alignment-Test.zip
          if-no-files-found: error
