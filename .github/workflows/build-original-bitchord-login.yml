name: Build original BitChord with Google sign-in (PR 691)
on:
  push:
    branches: [bitchord-original-google-login-691]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mac:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - name: Checkout original BitChord with merged Google sign-in
        uses: actions/checkout@v4
        with:
          repository: kushagrasinghx/BitChord
          ref: 41198be97245cc3e7e3c0540da55435f3f02a9ea
          persist-credentials: false
      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :desktopApp:packageDmg -Pbitchord.version=1.8.1-pr691 --no-daemon --stacktrace
          find desktopApp/build/compose/binaries/main/dmg -type f -maxdepth 1 -print
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-original-PR691-mac-arm64
          path: desktopApp/build/compose/binaries/main/dmg/*.dmg
          retention-days: 7
          if-no-files-found: error
      - name: Upload Gradle diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BitChord-PR691-gradle-reports
          path: |
            desktopApp/build/reports/
            shared/build/reports/
          if-no-files-found: ignore
