
name: Build AirSync+ (Private)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check compiler
        run: |
          xcodebuild -version
          sw_vers

      - name: Clone official AirSync source
        run: |
          git init source
          git -C source remote add origin https://github.com/sameerasw/airsync-mac.git
          git -C source fetch --depth 1 origin 767bdeb2f6c043de04af0924ccec2ecd889d572f
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "767bdeb2f6c043de04af0924ccec2ecd889d572f"

      - name: Prepare self-compiled configuration
        run: |
          mkdir -p source/airsync-mac/Configs
          touch source/airsync-mac/Configs/Shared.xcconfig

          cat > source/airsync-mac/Configs/SelfCompiled.xcconfig <<'EOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) SELF_COMPILED
          EOF

      - name: Fix manual clipboard sending from menu bar
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("airsync-mac/Screens/MenubarView/MenubarSegments.swift")
          source = path.read_text(encoding="utf-8")
          start = source.index("    private func sendClipboard() {")
          end = source.index("    private func openQuickShare()", start)
          handler = source[start:end]

          old = "        }\n    }\n"
          new = (
              "        } else if let text = pasteboard.string(forType: .string), !text.isEmpty {\n"
              "            appState.sendClipboardToAndroid(text: text)\n"
              "        }\n    }\n"
          )
          if handler.count(old) != 1 or "appState.sendClipboardToAndroid(text: text)" in handler:
              raise SystemExit("Upstream menu-bar clipboard handler changed; refusing unsafe patch")

          patched = source[:start] + handler.replace(old, new, 1) + source[end:]
          path.write_text(patched, encoding="utf-8")
          print("Manual menu-bar text clipboard send enabled. Empty clipboard is a no-op.")
          PY

      - name: Hide duplicate notifications from AirSync menu bar
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("airsync-mac/Screens/MenubarView/MenubarView.swift")
          source = path.read_text(encoding="utf-8")
          old = (
              "            NotificationsSegmentView()\n"
              "                .staggeredEntrance(index: 4, isVisible: appState.isMenubarWindowOpen)\n"
          )
          if source.count(old) != 1:
              raise SystemExit("Upstream menu-bar layout changed; refusing unsafe patch")

          path.write_text(source.replace(old, "", 1), encoding="utf-8")
          print("AirSync menu-bar notification cards hidden; native notification delivery unchanged.")
          PY

      - name: Confirm Self Compiled scheme
        working-directory: source
        run: xcodebuild -list -project AirSync.xcodeproj

      - name: Build AirSync+ for Apple Silicon
        working-directory: source
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration "Self Compiled" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AirSyncBuild" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/AirSync-build.log"

      - name: Package compiled application
        shell: bash
        run: |
          APP="$RUNNER_TEMP/AirSyncBuild/Build/Products/Self Compiled/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "AirSync.app not found at expected build path"
            find "$RUNNER_TEMP/AirSyncBuild/Build/Products" \
              -maxdepth 3 -name 'AirSync.app' -print
            exit 1
          fi

          ditto -c -k --keepParent \
            "$APP" \
            "$GITHUB_WORKSPACE/AirSync-Plus.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Plus
          path: AirSync-Plus.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-build-log
          path: ${{ runner.temp }}/AirSync-build.log
          retention-days: 3
          if-no-files-found: ignore
