
name: Build AirSync+ (Private)

on:
  workflow_dispatch:
  push:
    branches: [main, fix/notification-icon-layout]
    paths:
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: xcode-27
    timeout-minutes: 45

    steps:
      - name: Check out AirSync build assets
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check compiler
        run: |
          xcodebuild -version
          sw_vers

      - name: Clone official AirSync source
        run: |
          git init source
          git -C source remote add origin https://github.com/sameerasw/airsync-mac.git
          git -C source fetch --depth 1 origin 767bdeb2f6c043de04af0924ccec2ecd889d572f
          git -C source checkout --detach FETCH_HEAD
          test "$(git -C source rev-parse HEAD)" = "767bdeb2f6c043de04af0924ccec2ecd889d572f"

      - name: Prepare self-compiled configuration
        run: |
          mkdir -p source/airsync-mac/Configs
          touch source/airsync-mac/Configs/Shared.xcconfig

          cat > source/airsync-mac/Configs/SelfCompiled.xcconfig <<'EOF'
          SWIFT_ACTIVE_COMPILATION_CONDITIONS = $(inherited) SELF_COMPILED
          EOF

      - name: Fix manual clipboard sending from menu bar
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("airsync-mac/Screens/MenubarView/MenubarSegments.swift")
          source = path.read_text(encoding="utf-8")
          start = source.index("    private func sendClipboard() {")
          end = source.index("    private func openQuickShare()", start)
          handler = source[start:end]

          old = "        }\n    }\n"
          new = (
              "        } else if let text = pasteboard.string(forType: .string), !text.isEmpty {\n"
              "            appState.sendClipboardToAndroid(text: text)\n"
              "        }\n    }\n"
          )
          if handler.count(old) != 1 or "appState.sendClipboardToAndroid(text: text)" in handler:
              raise SystemExit("Upstream menu-bar clipboard handler changed; refusing unsafe patch")

          patched = source[:start] + handler.replace(old, new, 1) + source[end:]
          path.write_text(patched, encoding="utf-8")
          print("Manual menu-bar text clipboard send enabled. Empty clipboard is a no-op.")
          PY

      - name: Hide duplicate notifications from AirSync menu bar
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("airsync-mac/Screens/MenubarView/MenubarView.swift")
          source = path.read_text(encoding="utf-8")
          old = (
              "            NotificationsSegmentView()\n"
              "                .staggeredEntrance(index: 4, isVisible: appState.isMenubarWindowOpen)\n"
          )
          if source.count(old) != 1:
              raise SystemExit("Upstream menu-bar layout changed; refusing unsafe patch")

          path.write_text(source.replace(old, "", 1), encoding="utf-8")
          print("AirSync menu-bar notification cards hidden; native notification delivery unchanged.")
          PY

      - name: Center the visible Android notification icon
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("airsync-mac/Core/AppState.swift")
          source = path.read_text(encoding="utf-8")
          original = """\
                  // Save NSImage as a temporary PNG file to attach in notification
                  guard let tiffData = icon.tiffRepresentation,
                        let bitmap = NSBitmapImageRep(data: tiffData),
                        let pngData = bitmap.representation(using: .png, properties: [:]) else {
                      return nil
                  }
          """
          aligned = """\
                  let canvasSize = CGSize(width: 256, height: 256)
                  let artworkBounds = CGRect(x: 56, y: 112, width: 144, height: 144)
                  let imageSize = icon.size
                  guard imageSize.width > 0, imageSize.height > 0 else { return nil }

                  let scale = min(
                      artworkBounds.width / imageSize.width,
                      artworkBounds.height / imageSize.height
                  )
                  let width = imageSize.width * scale
                  let height = imageSize.height * scale
                  let artworkRect = CGRect(
                      x: artworkBounds.midX - width / 2,
                      y: artworkBounds.midY - height / 2,
                      width: width,
                      height: height
                  )

                  // Notification Center draws the attachment lower than the sender icon.
                  // Fit its artwork near the top of a transparent square to align the visible icons.
                  let thumbnail = NSImage(size: canvasSize, flipped: false) { _ in
                      icon.draw(
                          in: artworkRect,
                          from: .zero,
                          operation: .sourceOver,
                          fraction: 1,
                          respectFlipped: true,
                          hints: [.interpolation: NSImageInterpolation.high]
                      )
                      return true
                  }

                  guard let tiffData = thumbnail.tiffRepresentation,
                        let bitmap = NSBitmapImageRep(data: tiffData),
                        let pngData = bitmap.representation(using: .png, properties: [:]) else {
                      return nil
                  }
          """
          if source.count(original.rstrip("\n")) != 1:
              raise SystemExit("Upstream notification icon code changed")
          path.write_text(source.replace(original.rstrip("\n"), aligned.rstrip("\n"), 1), encoding="utf-8")
          PY

      - name: Confirm Self Compiled scheme
        working-directory: source
        run: xcodebuild -list -project AirSync.xcodeproj

      - name: Build AirSync+ for Apple Silicon
        working-directory: source
        shell: bash
        run: |
          set -o pipefail

          xcodebuild \
            -project AirSync.xcodeproj \
            -scheme "AirSync Self Compiled" \
            -configuration "Self Compiled" \
            -destination 'generic/platform=macOS' \
            -derivedDataPath "$RUNNER_TEMP/AirSyncBuild" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/AirSync-build.log"

      - name: Package compiled application
        shell: bash
        run: |
          APP="$RUNNER_TEMP/AirSyncBuild/Build/Products/Self Compiled/AirSync.app"

          if [ ! -d "$APP" ]; then
            echo "AirSync.app not found at expected build path"
            find "$RUNNER_TEMP/AirSyncBuild/Build/Products" \
              -maxdepth 3 -name 'AirSync.app' -print
            exit 1
          fi

          cp assets/BlueAirSync.icns "$APP/Contents/Resources/BlueAirSync.icns"
          python3 - "$APP/Contents/Info.plist" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          info = plistlib.loads(path.read_bytes())
          info["CFBundleIconFile"] = "BlueAirSync"
          info.pop("CFBundleIconName", None)
          primary = info.get("CFBundleIcons", {}).get("CFBundlePrimaryIcon", {})
          primary["CFBundleIconFiles"] = ["BlueAirSync"]
          primary.pop("CFBundleIconName", None)
          path.write_bytes(plistlib.dumps(info, fmt=plistlib.FMT_BINARY, sort_keys=False))
          PY

          # Xcode strips development files when embedding frameworks, invalidating their resource seals.
          for framework in "$APP"/Contents/Frameworks/*.framework; do
            codesign --force --sign - "$framework"
          done

          for extension in "$APP"/Contents/PlugIns/*.appex; do
            case "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$extension/Contents/Info.plist")" in
              sameerasw.airsync-mac.share) entitlements=AirSyncShareExtension.entitlements ;;
              sameerasw.airsync-mac.widget) entitlements=AirSyncWidgetExtension.entitlements ;;
              *) echo "Unexpected app extension: $extension"; exit 1 ;;
            esac
            codesign --force --sign - --entitlements "source/$entitlements" "$extension"
          done
          codesign --force --sign - --entitlements source/AirSync.entitlements "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -verify_arch arm64 "$APP/Contents/MacOS/AirSync"

          STAGING="$RUNNER_TEMP/AirSync-DMG"
          mkdir -p "$STAGING"
          ditto "$APP" "$STAGING/AirSync.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="$GITHUB_WORKSPACE/AirSync-Plus-4.2.0-arm64.dmg"
          hdiutil create -volname 'AirSync+' -srcfolder "$STAGING" -format UDZO "$DMG"
          hdiutil verify "$DMG"

          ditto -c -k --keepParent \
            "$APP" \
            "$GITHUB_WORKSPACE/AirSync-Plus.zip"

      - name: Upload application
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Plus
          path: AirSync-Plus.zip
          retention-days: 7
          if-no-files-found: error

      - name: Upload disk image
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-Plus-4.2.0-arm64
          path: AirSync-Plus-4.2.0-arm64.dmg
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log if failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: AirSync-build-log
          path: ${{ runner.temp }}/AirSync-build.log
          retention-days: 3
          if-no-files-found: ignore
